services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    volumes:
      - clientops-data:/app/data
      - clientops-uploads:/app/uploads
    environment:
      DATABASE_URL: sqlite:////app/data/clientops.db
      UPLOAD_DIRECTORY: /app/uploads
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  clientops-data:
  clientops-uploads:
